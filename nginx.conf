server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx does NOT inherit `add_header` into a location that declares one of
    # its own — the whole set is replaced, not merged. Every location below sets
    # Cache-Control, so a server-level security header would reach nothing but
    # the paths that happen to have no headers of their own. Hence the repetition:
    # it is load-bearing, not redundant. Keep the three lines together.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Vite emits content-hashed asset filenames, so they can be cached forever.
    location /assets/ {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell must never be cached, or a deploy leaves clients on stale assets.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    # The app has an inline data: favicon, so a request here means a browser
    # asking speculatively. Answer it rather than handing back the HTML shell.
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    # Single-page app: unknown paths fall through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
}
